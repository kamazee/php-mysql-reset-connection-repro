services:
  database:
    image: docker.io/clickhouse/clickhouse-server:26.7.1.1315
    command: []
    environment:
      MYSQL_DATABASE: !reset null
      MYSQL_USER: !reset null
      MYSQL_PASSWORD: !reset null
      MYSQL_ROOT_PASSWORD: !reset null
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./docker/clickhouse/config.d/mysql.xml:/etc/clickhouse-server/config.d/mysql.xml:ro,Z
    healthcheck: !override
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s

  php:
    environment:
      PHP_VERSION: ${PHP_VERSION:-8.6.0alpha3}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-9004}
      DB_NAME: ${DB_NAME:-default}
      DB_USER: ${DB_USER:-default}
      DB_PASSWORD: ${DB_PASSWORD:-}
    command: ["php", "/app/repro-clickhouse.php"]
